<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section 3 模式对齐工具</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #10161a; color: #e6edee; font-family: system-ui, sans-serif; padding-bottom: 3rem; }
h1 { font-size: 1.05rem; margin: 1.2rem 1.5rem 0.3rem; }
p.tip { font-size: 0.83rem; color: #8fa3a6; margin: 0 1.5rem 1.4rem; line-height: 1.65; max-width: 980px; }
.stage { margin: 0 auto 2rem; max-width: 900px; padding: 0 1rem; }
.label { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; }
.card {
  position: relative; width: 820px; max-width: 100%; aspect-ratio: 16 / 10;
  background: linear-gradient(180deg, #ffffff 0%, #c6ced2 100%);
  border-radius: 10px; overflow: hidden; margin: 0 auto;
}
.group { position: absolute; inset: 0; }
.group img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
/* 标注重现（会跟随图片一起移动缩放） */
.dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.8); pointer-events: none; }
.dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid rgba(255,255,255,.85); }
.dlbl { position: absolute; font-size: 11px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.9); white-space: nowrap; pointer-events: none; }
.handle {
  position: absolute; width: 18px; height: 18px; background: #c6e53d; border: 2px solid #0c1719;
  border-radius: 4px; cursor: nwse-resize; z-index: 20;
}
.handle.br { right: -9px; bottom: -9px; }
.handle.tl { left: -9px; top: -9px; cursor: nwse-resize; }
.grab { position: absolute; inset: 0; cursor: grab; z-index: 10; }
.grab:active { cursor: grabbing; }
.readout { margin: 0.5rem auto 0; max-width: 820px; background: #1a2427; border: 1px solid #31434a; border-radius: 8px; padding: 0.55rem 1rem; font-family: ui-monospace, monospace; font-size: 0.78rem; color: #c6e53d; }
button.copy-btn { margin: 1rem auto 0; display: block; width: 240px; padding: 0.5rem 0; font-size: 0.9rem; border: 1px solid #c6e53d; border-radius: 999px; background: transparent; color: #c6e53d; cursor: pointer; }
textarea { margin: 0.7rem auto; display: block; width: 820px; max-width: 94vw; height: 90px; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 0.76rem; background: #0c1214; color: #c6e53d; border: 1px solid #31434a; border-radius: 8px; padding: 0.6rem; }
</style>
</head>
<body>
<h1>Section 3 模式对齐工具</h1>
<p class="tip">四个选项各一个舞台。拖动<b>图片</b>调整位置、拖<b>绿角</b>等比缩放，让四个模式里的产品主体大小位置一致（参考 Vision 为主体目标）。白色圆点是各模式的标注点——它们会跟着图走，保证最终标注仍指向产品的同一位置。摆好后点"复制全部参数"发我。</p>

<div id="stages"></div>

<button class="copy-btn" id="copy-all">复制全部参数</button>
<textarea id="summary" readonly></textarea>

<script>
(function () {
  var modes = [
    { key: 'vision', label: 'Vision —— hero-goggles2', img: '/assets/images/hero-goggles2.webp?v=2',
      marks: [ { x: 57.1, y: 34.1, t: 'RGB 12MP / 30FPS 720P' } ] },
    { key: 'audio', label: 'Audio —— audio.webp', img: '/assets/images/sensors/audio.webp', marks: [] },
    { key: 'pose', label: 'Pose —— 3.1右侧俯视', img: '/assets/images/3.1右侧俯视.webp',
      marks: [ { x: 30.7, y: 64.9, t: 'ToF Sensor' }, { x: 63.4, y: 78, t: '6DOF IMU' } ] },
    { key: 'expansion', label: 'Expansion —— 4.1左俯俯视', img: '/assets/images/4.1左俯俯视.png',
      marks: [ { x: 68.2, y: 64.4, t: 'General Expansion Port' }, { x: 34.6, y: 77.4, t: 'Vision Expansion Port' } ] },
  ];
  // 预置（粗略估算，用户自行微调）：s=缩放 dx/dy=相对卡片中心的 % 偏移
  var presets = {
    vision: { s: 1, dx: 0, dy: 0 },
    audio: { s: 1.55, dx: 0, dy: 0 },
    pose: { s: 2.2, dx: -1.5, dy: 4 },
    expansion: { s: 1.65, dx: 2, dy: -2 },
  };
  var state = {};

  function buildStage(mode) {
    var st = state[mode.key] = Object.assign({}, presets[mode.key]);
    var wrap = document.createElement('div');
    wrap.className = 'stage';
    var html = '<div class="label">' + mode.label + '</div><div class="card" id="card-' + mode.key + '">' +
      '<div class="group" id="group-' + mode.key + '">' +
      '<img src="' + mode.img + '" alt="">';
    mode.marks.forEach(function (m) {
      html += '<div class="dot" style="left:' + m.x + '%;top:' + m.y + '%;"></div>' +
        '<div class="dlbl" style="left:calc(' + m.x + '% + 12px);top:calc(' + m.y + '% - 5px);">' + m.t + '</div>';
    });
    html += '</div><div class="grab" id="grab-' + mode.key + '"></div>' +
      '<div class="handle br" data-k="' + mode.key + '" data-h="br"></div>' +
      '<div class="handle tl" data-k="' + mode.key + '" data-h="tl"></div></div>' +
      '<div class="readout" id="out-' + mode.key + '"></div>';
    wrap.innerHTML = html;
    document.getElementById('stages').appendChild(wrap);
    apply(mode.key);
  }

  function apply(key) {
    var st = state[key];
    var g = document.getElementById('group-' + key);
    g.style.transform = 'translate(' + st.dx + '%, ' + st.dy + '%) scale(' + st.s + ')';
    document.getElementById('out-' + key).textContent =
      key.toUpperCase() + ': 缩放 ' + st.s.toFixed(2) + 'x | 水平 ' + st.dx + '% | 垂直 ' + st.dy + '%';
    syncSummary();
  }

  function syncSummary() {
    document.getElementById('summary').value = JSON.stringify(state);
  }

  function startDrag(e, key, kind) {
    e.preventDefault();
    var st = state[key];
    var card = document.getElementById('card-' + key);
    var r = card.getBoundingClientRect();
    var s0 = { s: st.s, dx: st.dx, dy: st.dy };
    var startX = (e.touches ? e.touches[0].clientX : e.clientX);
    var startY = (e.touches ? e.touches[0].clientY : e.clientY);
    function move(ev) {
      var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - startX;
      var cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - startY;
      if (kind === 'move') {
        st.dx = Math.round((s0.dx + cx / r.width * 100) * 10) / 10;
        st.dy = Math.round((s0.dy + cy / r.height * 100) * 10) / 10;
      } else {
        // 手势向右/下=放大
        var delta = (cx / r.width + cy / r.height);
        st.s = Math.round(Math.min(4, Math.max(0.5, s0.s * (1 + delta))) * 100) / 100;
      }
      apply(key);
    }
    function up() {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', up);
    }
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', up);
  }

  modes.forEach(buildStage);

  document.body.addEventListener('mousedown', function (e) {
    var g = e.target.closest('.grab'); if (g) startDrag(e, g.id.replace('grab-', ''), 'move');
  });
  document.body.addEventListener('touchstart', function (e) {
    var g = e.target.closest('.grab'); if (g) startDrag(e, g.id.replace('grab-', ''), 'move');
  }, { passive: false });
  document.body.addEventListener('mousedown', function (e) {
    var h = e.target.closest('.handle'); if (h) startDrag(e, h.dataset.k, 'resize');
  });
  document.body.addEventListener('touchstart', function (e) {
    var h = e.target.closest('.handle'); if (h) startDrag(e, h.dataset.k, 'resize');
  }, { passive: false });

  document.getElementById('copy-all').addEventListener('click', function () {
    var ta = document.getElementById('summary');
    ta.select();
    try { document.execCommand('copy'); this.textContent = '已复制!'; }
    catch (err) { this.textContent = '请手动全选下方文本复制'; }
    setTimeout(function () { document.getElementById('copy-all').textContent = '复制全部参数'; }, 1500);
  });

  syncSummary();
})();
</script>
</body>
</html>
