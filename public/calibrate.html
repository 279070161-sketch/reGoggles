<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标注位置与线条轨迹校准工具</title>
<style>
:root { color-scheme: light; }
body { margin: 0; background: #f3f5f6; color: #142325; font-family: system-ui, sans-serif; padding-bottom: 4rem; }
h1 { font-size: 1.1rem; margin: 1.2rem 1.5rem 0.4rem; }
p.tip { font-size: 0.85rem; color: #5a6b6d; margin: 0 1.5rem 1.2rem; line-height: 1.6; max-width: 980px; }
.stage { max-width: 1400px; margin: 0 auto 1.5rem; padding: 0 1.5rem; }
.label { font-size: 0.82rem; font-weight: 700; margin: 0 0 0.4rem; }
.card { position: relative; width: 100%; max-width: 820px; margin: 130px auto; aspect-ratio: 16 / 10; background: transparent; }
.imgwrap { position: absolute; inset: 0; overflow: visible; border-radius: 8px; background: #0c1719; }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
/* 与站点一致的模式对齐变换（用户改站点后记得同步这里） */
#card-vision .imgwrap img { transform: scale(1.2); }
#card-tof .imgwrap img, #card-imu .imgwrap img { transform: translate(5%, -12%) scale(1.3); }
#card-extgen .imgwrap img, #card-extvis .imgwrap img { transform: translateY(-10%) scale(1.3); }
.card svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.track { stroke: #ffffff; stroke-width: 1.5; fill: none; }
.dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; border: 2px solid #c6e53d; cursor: grab; z-index: 10; touch-action: none; box-sizing: border-box; }
.corner { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 3px; background: #c6e53d; border: 2px solid #0c1719; cursor: grab; z-index: 11; touch-action: none; box-sizing: border-box; }
.hend { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: transparent; border: 2px dashed #ffffff; border-radius: 50%; cursor: grab; z-index: 11; touch-action: none; box-sizing: border-box; }
.txt { position: absolute; cursor: grab; z-index: 9; user-select: none; touch-action: none; padding: 2px 0; width: max-content; }
.txt .line { font-size: 0.92rem; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); line-height: 1.35; pointer-events: none; }
.dragging { cursor: grabbing !important; }
.midx { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font-size: 10px; background: #c6e53d; color: #0c1719; border-radius: 4px; padding: 0 5px; pointer-events: none; }
.readout { max-width: 820px; margin: 0.8rem auto 0; background: #fff; border: 1px solid #dde3e4; border-radius: 8px; padding: 0.7rem 1rem; font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; line-height: 1.75; word-break: break-all; }
.readout .row { font-weight: 700; margin-bottom: 0.1rem; }
.out { max-width: 820px; margin: 0.6rem auto; }
.copy-btn { margin: 0.6rem auto 0; display: block; width: 200px; padding: 0.45rem 0; font-size: 0.85rem; border: 1px solid #142325; border-radius: 999px; background: #fff; cursor: pointer; }
.copy-btn:hover { background: #142325; color: #fff; }
textarea { width: 100%; height: 130px; box-sizing: border-box; font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; border: 1px solid #dde3e4; border-radius: 8px; padding: 0.6rem; }
</style>
</head>
<body>
<h1>标注位置与线条轨迹校准工具</h1>
<p class="tip">拖动<b>白圆点</b>＝定位点（线从这出发）；拖<b>绿色方块</b>＝折线拐点；拖<b>虚线圈</b>＝线终点（连到文字）；拖<b>文字块</b>＝标签位置。坐标允许负值和超过 100% 的值（-80% 到 180%），线和文字可以自由向四周延伸，与真实站点行为一致。<b>多点 stage（Audio-Mic×3、Audio-Speaker×2）</b>：每个点都有独立的一套小把手（点上方有编号 M0/M1/M2），共享同一个文字标签。摆好后点"复制全部"发我。</p>

<div id="stages"></div>

<div class="out">
  <button class="copy-btn" id="copy-all">复制全部代码</button>
  <textarea id="summary" readonly></textarea>
</div>

<script>
(function () {
  // 每个 stage：marks 为 [dot,corner,end]×N，共享一个 text
  var stages = [
    { key: 'vision', label: 'Vision —— hero-goggles2（1.2x）', img: '/assets/images/hero-goggles2.webp?v=2',
      text: { x: 83, y: -8.2 }, lines: ['RGB 12MP<br>30FPS 720P Live Streaming'],
      marks: [ { dot: {x:58.5,y:30.9}, corner: {x:71.6,y:-2.8}, end: {x:82.4,y:-2.8} } ] },
    { key: 'tof', label: 'Pose-ToF —— 3.1右侧俯视（1.3x）', img: '/assets/images/3.1右侧俯视.webp',
      text: { x: -19.3, y: 69.2 }, lines: ['ToF Sensor<br>(Requer Additional module)'],
      marks: [ { dot: {x:29.9,y:57.4}, corner: {x:5.5,y:56.2}, end: {x:-3.8,y:69.4} } ] },
    { key: 'imu', label: 'Pose-IMU —— 3.1右侧俯视（1.3x）', img: '/assets/images/3.1右侧俯视.webp',
      text: { x: 95.3, y: 83.7 }, lines: ['6DOF IMU Sensor'],
      marks: [ { dot: {x:72.4,y:74.4}, corner: {x:90.4,y:73.8}, end: {x:96.1,y:81.7} } ] },
    { key: 'extgen', label: 'Extension-General Port —— 4.1左俯俯视（1.3x/上移10%）', img: '/assets/images/4.1左俯俯视.png',
      text: { x: 97.2, y: 10.2 }, lines: ['General Expansion Port<br>Additional Camera, ToF, SD Card<br>and Custom Modules'],
      marks: [ { dot: {x:73.7,y:58.7}, corner: {x:85.6,y:14.5}, end: {x:93.9,y:14.5} } ] },
    { key: 'extvis', label: 'Extension-Vision Port —— 4.1左俯俯视（1.3x/上移10%）', img: '/assets/images/4.1左俯俯视.png',
      text: { x: -12.8, y: 92.8 }, lines: ['Vision Expansion Port<br>Additional Camera+IMU and Custom Modules'],
      marks: [ { dot: {x:30,y:75.6}, corner: {x:12.8,y:93.6}, end: {x:12.7,y:93.6} } ] },
    { key: 'audmic', label: 'Audio-Mic ×3 —— front（3 个点共用一个标签）', img: '/assets/images/front.webp',
      text: { x: 68, y: 6.5 }, lines: ['3-Microphone Array'],
      marks: [
        { dot: {x:6.2,y:50.3}, corner: {x:49.9,y:9.1}, end: {x:66.1,y:9.1} },
        { dot: {x:49.9,y:24.1}, corner: {x:49.9,y:9.1}, end: {x:66.1,y:9.1} },
        { dot: {x:94.1,y:50.5}, corner: {x:49.9,y:9.1}, end: {x:66.1,y:9.1} }
      ] },
    { key: 'audspk', label: 'Audio-Speaker ×2 —— front（2 个点共用一个标签）', img: '/assets/images/front.webp',
      text: { x: 12.1, y: 101.2 }, lines: ['2-Stereo Speaker'],
      marks: [
        { dot: {x:11.8,y:75.1}, corner: {x:50.7,y:103.9}, end: {x:28.9,y:103.8} },
        { dot: {x:87.9,y:75.6}, corner: {x:50.7,y:103.9}, end: {x:28.9,y:103.8} }
      ] }
  ];

  function build() {
    var wrap = document.getElementById('stages');
    stages.forEach(function (s) {
      var html = '<div class="stage"><div class="label">' + s.label + '</div>' +
        '<div class="card" id="card-' + s.key + '">' +
        '<div class="imgwrap"><img src="' + s.img + '" alt=""></div>' +
        '<svg id="svg-' + s.key + '" viewBox="0 0 100 100" preserveAspectRatio="none">' +
        s.marks.map(function (m, i) {
          return '<path class="track" data-i="' + i + '" d=""/>';
        }).join('') + '</svg>' +
        '<div class="txt" id="txt-' + s.key + '"><span class="line">' + s.lines.join('<br>') + '</span></div>';
      s.marks.forEach(function (m, i) {
        html += '<div class="dot" id="dot-' + s.key + '-' + i + '"><div class="midx">M' + i + '</div></div>' +
          '<div class="corner" id="corner-' + s.key + '-' + i + '"></div>' +
          '<div class="hend" id="end-' + s.key + '-' + i + '"></div>';
      });
      html += '</div><div class="readout" id="out-' + s.key + '"></div></div>';
      wrap.insertAdjacentHTML('beforeend', html);
    });
  }

  function r1(v) { return Math.round(v * 10) / 10; }

  function render() {
    var summary = '';
    stages.forEach(function (s) {
      document.getElementById('txt-' + s.key).style.left = s.text.x + '%';
      document.getElementById('txt-' + s.key).style.top = s.text.y + '%';
      s.marks.forEach(function (mark, i) {
        document.getElementById('dot-' + s.key + '-' + i).style.left = mark.dot.x + '%';
        document.getElementById('dot-' + s.key + '-' + i).style.top = mark.dot.y + '%';
        document.getElementById('corner-' + s.key + '-' + i).style.left = mark.corner.x + '%';
        document.getElementById('corner-' + s.key + '-' + i).style.top = mark.corner.y + '%';
        document.getElementById('end-' + s.key + '-' + i).style.left = mark.end.x + '%';
        document.getElementById('end-' + s.key + '-' + i).style.top = mark.end.y + '%';
        var d = 'M ' + mark.dot.x + ' ' + mark.dot.y + ' L ' + mark.corner.x + ' ' + mark.corner.y + ' L ' + mark.end.x + ' ' + mark.end.y;
        document.querySelector('#svg-' + s.key + ' [data-i="' + i + '"]').setAttribute('d', d);
      });

      var out = '<div class="row">' + s.key.toUpperCase() + '</div>';
      s.marks.forEach(function (mark, i) {
        out += 'M' + i + ': dot ' + mark.dot.x + '%/' + mark.dot.y + '% &nbsp;|&nbsp; corner ' + mark.corner.x + '%/' + mark.corner.y + '% &nbsp;|&nbsp; end ' + mark.end.x + '%/' + mark.end.y + '%<br>';
      });
      out += 'text: ' + s.text.x + '%/' + s.text.y + '%';
      document.getElementById('out-' + s.key).innerHTML = out;

      summary += s.key.toUpperCase() + ':';
      s.marks.forEach(function (mark, i) {
        summary += ' M' + i + ' dot ' + mark.dot.x + '/' + mark.dot.y + ' corner ' + mark.corner.x + '/' + mark.corner.y + ' end ' + mark.end.x + '/' + mark.end.y + ';';
      });
      summary += ' text ' + s.text.x + '/' + s.text.y + '\n';
    });
    document.getElementById('summary').value = summary;
  }

  function startDrag(e, key, part, idx) {
    e.preventDefault();
    var s = stages.find(function (x) { return x.key === key; });
    var target = part === 'text' ? s.text : s.marks[idx][part];
    var card = document.getElementById('card-' + key);
    var handleId = part === 'text' ? ('txt-' + key) : (part + '-' + key + '-' + idx);
    var handle = document.getElementById(handleId);
    handle.classList.add('dragging');

    function move(ev) {
      var rect = card.getBoundingClientRect();
      var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX);
      var cy = (ev.touches ? ev.touches[0].clientY : ev.clientY);
      target.x = r1(Math.min(180, Math.max(-80, (cx - rect.left) / rect.width * 100)));
      target.y = r1(Math.min(180, Math.max(-80, (cy - rect.top) / rect.height * 100)));
      render();
    }
    function up() {
      handle.classList.remove('dragging');
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', up);
    }
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', up);
  }

  function bind() {
    stages.forEach(function (s) {
      ['txt'].forEach(function (part) {
        var el = document.getElementById(part + '-' + s.key);
        el.addEventListener('mousedown', function (e) { startDrag(e, s.key, 'text'); });
        el.addEventListener('touchstart', function (e) { startDrag(e, s.key, 'text'); }, { passive: false });
      });
      s.marks.forEach(function (mark, i) {
        ['dot', 'corner', 'end'].forEach(function (part) {
          var el = document.getElementById(part + '-' + s.key + '-' + i);
          el.addEventListener('mousedown', function (e) { startDrag(e, s.key, part, i); });
          el.addEventListener('touchstart', function (e) { startDrag(e, s.key, part, i); }, { passive: false });
        });
      });
    });
  }

  document.getElementById('copy-all').addEventListener('click', function () {
    var ta = document.getElementById('summary');
    ta.select();
    try { document.execCommand('copy'); this.textContent = '已复制!'; }
    catch (err) { this.textContent = '请手动全选下方文本复制'; }
    setTimeout(function () { document.getElementById('copy-all').textContent = '复制全部代码'; }, 1500);
  });

  build();
  bind();
  render();
})();
</script>
</body>
</html>
